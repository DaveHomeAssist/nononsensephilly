<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Confirm Your Signup · No Nonsense</title>
<style>
:root{color-scheme:light;--bg:#f3eee4;--card:#fffaf3;--ink:#211927;--accent:#b3124f;--line:#cbbfb3}html[data-theme=dark]{color-scheme:dark;--bg:#100d16;--card:#1c1626;--ink:#f4efe6;--accent:#ff80b2;--line:#51435e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;height:100dvh;display:grid;place-items:center;padding:20px}main{width:min(100%,32rem);max-height:100%;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,36px)}header{display:flex;align-items:center;justify-content:space-between;gap:16px}small{text-transform:uppercase;letter-spacing:.1em;font-weight:700}h1{font-size:clamp(26px,5vw,36px);line-height:1.12}button{font:inherit;min-height:44px;cursor:pointer;border:1px solid var(--line);border-radius:9px;padding:10px 16px;background:var(--card);color:var(--ink)}button:disabled{opacity:.55;cursor:default}#confirm{background:var(--accent);color:var(--bg);font-weight:700}a{color:var(--accent)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}#status{min-height:3em}
</style>
<script src="confirm.js" defer></script>
</head>
<body><main><header><small>No Nonsense · Philadelphia</small><button id="theme" type="button" aria-label="Switch to dark theme">◐</button></header><h1>Your next night starts here.</h1><p>Confirm that you want show announcements, on-sale alerts and location drops at the email address that received this link.</p><button id="confirm" type="button" disabled>Confirm signup</button><p id="status" role="status">Checking your link…</p><p><a href="https://nononsensephilly.com">Back to No Nonsense</a></p><noscript><p>JavaScript is required to confirm. No signup occurs just by opening this page.</p></noscript></main></body></html>
