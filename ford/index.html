<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="googlebot" content="noindex, nofollow">

<body>
<title>PCV job console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
JOB CONSOLE  ·  schema job-console/1
One step-by-step job as a full-screen console. The page never scrolls; long lists scroll inside
their own panel. Three columns from 1100px wide; below that, Step / Steps / Info tabs with
BACK and GO pinned at the bottom.

Make a new job
  1. Copy this file.
  2. Replace the JSON inside <script id="job"> with the new job.
  3. Replace the JSON inside <script id="job-assets"> with the new job's embedded images,
     or set it to {} and point each photo "src" (and "thumb") at an image URL.
  Nothing else changes per job. The renderer reads only those two blocks.

Job fields (plain text everywhere; the design sets letter case)
  schema    "job-console/1"
  id        unique slug; step progress and checklists save on the device under it
  kicker    small line above the title, e.g. "Service procedure"
  title     job name
  subject   one or two lines for the header chip, e.g. ["2001 Focus", "2.0L DOHC Zetec"]
  alerts    up to 3 of { level: crit | warn | tip, text }
  route     { label, nodes: [{ id, label, tag }] }  optional strip; each step lights its nodes
  steps     [{ phase, title, body, route: [node ids], notes: [note ids],
               plates: [{ photo | drawing: id, caption }] }]   up to 3 plates per step
  notes     { id: { level: tip | warn | crit, title, text, fix } }
            warn and crit notes also list on the Risks tab, linked to the first step that uses them
  kit       [{ title, items: [{ id, name, note, photo | icon }] }]   checklists on the Kit tab
  why       { photo, caption, sections: [{ title, text | chips | list }], summary }
  finish    { title, text }   shown after the last step
  photos    { id: { src, thumb, alt, what, author, license, short, page, labels: [{ text, at }] } }
            src and thumb are URLs or "asset:<id>" from the job-assets block; thumb is optional and
            used for the small list images. at is top-left, top-right, bottom-left or bottom-right
  credits   { source, note }   Photos tab header and footnote
  drawings  { id: { viewBox, label, svg } }   inline SVG markup, colored with currentColor and
            the --ink, --ink-muted, --ink-dim, --accent, --line-strong, --ok, --warn, --crit tokens
  icons     { id: svg markup on a 48x48 grid, stroked }

Links: #step-5 opens step 5 and #done opens the finish screen; the address follows the current step.
Tabs, the route strip, the alert bar and plates hide themselves when a job leaves them out.
Problems in the job data show in a banner on the console instead of failing silently.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: full-screen job console. Header band, alert bar, then steps | current step | reference tabs.
   Under 1100px the three panels become Step / Steps / Info tabs. Dark first, light on toggle. */
:root{
  color-scheme:dark;
  --sans:"Barlow",ui-sans-serif,system-ui,"Segoe UI",Arial,sans-serif;
  --cond:"Barlow Semi Condensed","Arial Narrow",ui-sans-serif,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --band:#0b2d6b;--band-ink:#ffffff;--band-muted:#b9c9e8;--band-line:#3a5da3;--band-hover:#143d86;--band-ok:#5ee08a;
  --tag-bg:rgba(5,13,31,.82);--tag-ink:#ffffff;
  --ground:#050d1f;--panel:#0a1730;--card:#0e1d3b;--raised:#142852;--plate:#0b1834;
  --line:#1e3361;--line-strong:#2f4c86;
  --ink:#eef3fb;--ink-muted:#a8b7d3;--ink-dim:#8b9cbd;
  --accent:#6aa8ff;--go:#2259c9;--go-hover:#2a66de;--go-ink:#ffffff;
  --ok:#5ee08a;--warn:#ffb020;--crit:#ff6b62;--idle:#8b9cbd;
  --edge-ok:#1b5a3a;--edge-warn:#5a4414;--edge-crit:#5e2024;
  --readout:#dbe7ff;
  --fs-label:12px;--fs-small:11px;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    color-scheme:light;
    --ground:#e9eef5;--panel:#ffffff;--card:#ffffff;--raised:#eef3fa;--plate:#f4f7fb;
    --line:#d3dbe7;--line-strong:#9fb0c9;
    --ink:#0a1d40;--ink-muted:#42557a;--ink-dim:#55678b;
    --accent:#1d56c6;--go:#1d4fb8;--go-hover:#1a46a6;--go-ink:#ffffff;
    --ok:#12793a;--warn:#8f5b00;--crit:#c0261d;--idle:#55678b;
    --edge-ok:#b9dfc8;--edge-warn:#eed9a8;--edge-crit:#f1c3bf;
    --readout:#0b2d6b;
  }
}
:root[data-theme="light"]{
  color-scheme:light;
  --ground:#e9eef5;--panel:#ffffff;--card:#ffffff;--raised:#eef3fa;--plate:#f4f7fb;
  --line:#d3dbe7;--line-strong:#9fb0c9;
  --ink:#0a1d40;--ink-muted:#42557a;--ink-dim:#55678b;
  --accent:#1d56c6;--go:#1d4fb8;--go-hover:#1a46a6;--go-ink:#ffffff;
  --ok:#12793a;--warn:#8f5b00;--crit:#c0261d;--idle:#55678b;
  --edge-ok:#b9dfc8;--edge-warn:#eed9a8;--edge-crit:#f1c3bf;
  --readout:#0b2d6b;
}

html,body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink)}
.app{position:fixed;inset:0;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;overflow:hidden;
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--ground);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.app *,.app *::before,.app *::after{box-sizing:border-box}
.app button{font-family:inherit;cursor:pointer;margin:0;color:inherit}
.app button:disabled{cursor:default}
.app :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app .band :focus-visible{outline-color:var(--band-ink)}
.app h1,.app h2,.app p,.app figure,.app ul{margin:0}

.label{font-family:var(--cond);font-size:var(--fs-label);line-height:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)}
.count{font-family:var(--mono);font-size:var(--fs-label);line-height:16px;font-weight:500;color:var(--ink-muted);text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.scroll{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}

/* header band */
.band{flex:0 0 auto;display:flex;align-items:center;gap:18px;min-height:72px;padding:10px 20px;background:var(--band);color:var(--band-ink);border:1px solid var(--band-line);border-radius:8px}
.band-title{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.band-kicker{font-family:var(--cond);font-size:12px;line-height:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--band-muted)}
.band-name{font-family:var(--cond);font-size:24px;line-height:28px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subject{flex:0 0 auto;display:flex;flex-direction:column;gap:1px;padding:6px 12px;border:1px solid var(--band-line);border-radius:4px;text-transform:uppercase;white-space:nowrap}
.subject b{font-family:var(--mono);font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em}
.subject span{font-family:var(--mono);font-size:11px;line-height:14px;font-weight:500;color:var(--band-muted)}
.band-state{flex:0 0 auto;display:flex;align-items:center;gap:8px;font-family:var(--cond);font-size:14px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.band-rule{flex:0 0 1px;height:36px;background:var(--band-line)}
.band-count{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.band-count small{font-family:var(--cond);font-size:12px;line-height:14px;font-weight:600;letter-spacing:.12em;color:var(--band-muted);text-transform:uppercase}
.band-count b{font-family:var(--mono);font-size:20px;line-height:24px;font-weight:600;font-variant-numeric:tabular-nums}
.band-btn{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 14px;border-radius:6px;border:1px solid var(--band-line);background:transparent;color:var(--band-ink);font-family:var(--cond);font-size:13px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.band-btn:hover{background:var(--band-hover)}

/* status marks */
.dot{display:block;flex:0 0 auto;width:7px;height:7px}
.dot.ok{border-radius:50%;background:var(--ok)}
.dot.idle{background:var(--idle)}
.dot.run{border-radius:50%;border:2px solid var(--accent)}
.band .dot{width:8px;height:8px}
.band .dot.ok{background:var(--band-ok)}
.band .dot.idle{background:var(--band-muted)}
.band .dot.run{border-color:var(--band-ink)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--idle);font-family:var(--cond);font-size:var(--fs-label);line-height:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.pill.ok{border-color:var(--edge-ok);color:var(--ok)}
.pill.run{border-color:var(--accent);color:var(--ink)}
.pill.warn{border-color:var(--edge-warn);color:var(--warn)}
.pill.crit{border-color:var(--edge-crit);color:var(--crit)}

/* alert bar */
.alerts{flex:0 0 auto;display:grid;gap:16px;padding:10px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.alerts.inline{display:none}
.alert{display:flex;align-items:center;gap:12px;min-height:36px;min-width:0}
.alert-tag{flex:0 0 72px;display:flex;align-items:center;gap:8px;font-family:var(--cond);font-size:14px;line-height:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.alert-tag.crit{color:var(--crit)}.alert-tag.warn{color:var(--warn)}.alert-tag.tip{color:var(--accent)}
.alert p{font-size:14px;line-height:18px;font-weight:500;text-wrap:pretty}

/* three columns */
.views{display:none}
.body{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:360px minmax(0,1fr) 340px;gap:12px}
.body.no-aside{grid-template-columns:360px minmax(0,1fr)}
.panel{min-height:0;display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
aside.panel{gap:14px}

/* step list */
.cues{display:flex;flex-direction:column;gap:4px}
.phase{padding:10px 4px 4px}
.cue{display:grid;grid-template-columns:30px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:46px;padding:4px 10px;text-align:left;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.cue:hover{border-color:var(--line-strong);background:var(--raised)}
.cue.is-run{border-color:var(--accent);background:var(--raised)}
.cue.is-ok{color:var(--ink-muted)}
.cue-num{font-family:var(--mono);font-size:15px;line-height:20px;font-weight:600;font-variant-numeric:tabular-nums}
.cue-title{font-size:15px;line-height:18px;font-weight:600}

/* current step */
.main{min-width:0;min-height:0;display:flex;flex-direction:column;gap:14px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.step-head{flex:0 0 auto;display:flex;align-items:flex-end;gap:16px}
.readout-wrap{display:flex;flex-direction:column;gap:4px}
.readout{display:flex;align-items:baseline;gap:8px}
.readout b{font-family:var(--mono);font-size:48px;line-height:48px;font-weight:700;color:var(--readout);font-variant-numeric:tabular-nums}
.readout span{font-family:var(--mono);font-size:20px;line-height:24px;font-weight:600;color:var(--ink-muted)}
.step-phase{flex:1 1 auto;min-width:0;padding-bottom:4px;font-family:var(--cond);font-size:15px;line-height:18px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-muted)}
.step-head .pill{margin-bottom:4px}
.step-scroll{display:flex;flex-direction:column;gap:14px}
.plates{flex:0 0 196px;display:flex;gap:10px;min-height:0}
.plate{flex:1 1 0;min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--plate)}
.plate-art{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;color:var(--ink)}
.plate-art img,.plate-art svg,.why-art img{display:block;width:100%;height:100%}
.plate-art img,.why-art img{object-fit:cover}
.plate-art svg{font-family:var(--cond)}
.plate figcaption,.why-fig figcaption{flex:0 0 30px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px;padding:0 10px;border-top:1px solid var(--line);background:var(--card)}
.cap{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-family:var(--cond);font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em}
.credit{flex:0 0 auto;font-family:var(--mono);font-size:var(--fs-small);line-height:14px;font-weight:500;color:var(--ink-dim);text-transform:uppercase}
.tag{position:absolute;padding:3px 6px;border-radius:3px;background:var(--tag-bg);color:var(--tag-ink);font-family:var(--cond);font-size:var(--fs-small);line-height:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.tag.top-left{top:8px;left:8px}.tag.top-right{top:8px;right:8px}.tag.bottom-left{bottom:8px;left:8px}.tag.bottom-right{bottom:8px;right:8px}
.route{flex:0 0 auto;display:flex;align-items:stretch;min-height:44px}
.route>.label{flex:0 0 62px;display:flex;align-items:center}
.link{display:block;flex:0 0 12px;height:1px;align-self:center;background:var(--line-strong)}
.node{flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;padding:5px 6px;border-radius:4px;text-align:center;border:1px solid var(--line);color:var(--ink-dim)}
.node b{font-family:var(--cond);font-size:var(--fs-label);line-height:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node span{font-family:var(--mono);font-size:var(--fs-small);line-height:14px;font-weight:500;text-transform:uppercase}
.node.on{border-color:var(--accent);background:var(--raised);color:var(--ink)}
.node.on span{color:var(--ink-muted)}
.copy{display:flex;flex-direction:column;gap:14px}
.copy-text{display:flex;flex-direction:column;gap:6px}
.copy h2{font-family:var(--cond);font-size:30px;line-height:34px;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.lede{font-size:18px;line-height:27px;text-wrap:pretty;max-width:72ch}
.notes{display:flex;flex-direction:column;gap:8px}
.note{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.note.warn{border-color:var(--edge-warn)}.note.crit{border-color:var(--edge-crit)}
.note-head{display:flex;align-items:center;gap:10px}
.note-title{font-size:15px;line-height:20px;font-weight:600}
.note p{font-size:14px;line-height:20px}
.note-fix{display:flex;gap:10px;align-items:baseline}
.note-fix .label{flex:0 0 auto}
.note-fix span:last-child{font-size:14px;line-height:20px;color:var(--ink-muted)}
.note.tip{flex-direction:row;gap:12px;align-items:baseline}
.note.tip .label{flex:0 0 auto;color:var(--accent)}
.note.tip span:last-child{font-size:14px;line-height:20px}
.actions{flex:0 0 auto;display:flex;gap:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 24px;border-radius:6px;border:1px solid var(--line-strong);background:var(--raised);color:var(--ink);font-family:var(--cond);font-size:15px;line-height:18px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{border-color:var(--line);color:var(--ink-dim)}
.btn.go{flex:1 1 auto;min-width:0;gap:14px;border-color:var(--go);background:var(--go);color:var(--go-ink)}
.btn.go:hover{border-color:var(--go-hover);background:var(--go-hover)}
.btn.go b{font-size:24px;line-height:26px;font-weight:700;letter-spacing:.08em}
.btn.go span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.finish{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:20px;padding:0 12px}
.finish h2{font-family:var(--cond);font-size:32px;line-height:36px;font-weight:700}
.finish p{max-width:520px;font-size:18px;line-height:27px;color:var(--ink-muted);text-wrap:pretty}
.finish .actions{flex-wrap:wrap}

/* reference tabs */
.tabs{flex:0 0 auto;display:grid;gap:6px}
.tab{min-height:44px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink-muted);font-family:var(--cond);font-size:13px;line-height:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.tab:hover{border-color:var(--line-strong);background:var(--raised)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--raised);color:var(--ink)}
.stack{display:flex;flex-direction:column;gap:10px}
.stack.kit{gap:12px}
.kit-sec{display:flex;flex-direction:column}
.kit-sec>.row-between{padding-bottom:4px}
.item{display:flex;align-items:center;gap:10px;min-height:52px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item.has-thumb{min-height:56px}
.item input{flex:0 0 auto;width:20px;height:20px;margin:0;accent-color:var(--accent);cursor:pointer}
.thumb{flex:0 0 44px;width:44px;height:44px;border-radius:4px;overflow:hidden;background:var(--raised);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.item-text{min-width:0;display:flex;flex-direction:column;gap:1px}
.item-name{font-size:14px;line-height:19px;font-weight:600}
.item.plain .item-name{font-weight:400;line-height:20px}
.item-note{font-size:13px;line-height:17px;color:var(--ink-muted)}
.item.is-on .item-text,.item.is-on .item-note{color:var(--ink-muted)}
.why{display:flex;flex-direction:column;gap:16px}
.why-fig{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.why-art{position:relative;height:150px;overflow:hidden}
.why-sec{display:flex;flex-direction:column;gap:6px}
.why p{font-size:14px;line-height:21px;text-wrap:pretty}
.why .summary{color:var(--ink-muted)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.chip{display:flex;align-items:center;min-height:34px;padding:6px 10px;border-radius:4px;background:var(--raised);border:1px solid var(--line);font-family:var(--cond);font-size:13px;line-height:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.list>div{padding:8px 4px;border-bottom:1px solid var(--line);font-size:14px;line-height:20px}
.risk{display:flex;flex-direction:column;align-items:stretch;gap:6px;width:100%;padding:12px 14px;text-align:left;border-radius:6px;background:var(--card);border:1px solid var(--edge-warn);color:var(--ink)}
.risk.crit{border-color:var(--edge-crit)}
.risk:hover{border-color:var(--line-strong);background:var(--raised)}
.risk-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.risk-title{font-size:15px;line-height:20px;font-weight:600}
.risk-fix{font-size:13px;line-height:18px;color:var(--ink-muted)}
.credit-row{display:flex;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.credit-row img{flex:0 0 72px;display:block;width:72px;height:54px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.credit-text{min-width:0;display:flex;flex-direction:column;gap:1px}
.credit-text a,.credit-what{font-size:14px;line-height:19px;font-weight:600;color:var(--accent)}
.credit-text a:hover{color:var(--ink)}
.credit-what{color:var(--ink)}
.credit-author{font-size:12px;line-height:16px;color:var(--ink-muted)}
.credit-license{font-family:var(--mono);font-size:var(--fs-small);line-height:14px;font-weight:500;color:var(--ink-dim)}
.credit-note{font-size:13px;line-height:18px;color:var(--ink-muted)}

/* job data problems */
.problems{position:absolute;left:24px;right:24px;bottom:24px;z-index:5;max-height:45%;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:8px;background:var(--panel);border:1px solid var(--crit);color:var(--ink);font-size:14px;line-height:20px}
.problems b{font-family:var(--cond);font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--crit)}
.problems ul{padding-left:20px;display:flex;flex-direction:column;gap:2px}
.problems .btn{min-height:36px;padding:0 14px;font-size:13px}
.empty{flex:1 1 auto;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink-muted)}
.noscript{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;font:16px/1.5 system-ui,sans-serif;background:var(--ground);color:var(--ink)}

/* mid-width desktop */
@media (min-width:1100px) and (max-width:1365px){
  .body{grid-template-columns:300px minmax(0,1fr) 300px}
  .body.no-aside{grid-template-columns:300px minmax(0,1fr)}
}

/* under 1100px: one panel at a time, picked from the Step / Steps / Info tabs */
@media (max-width:1099px){
  :root{--fs-label:13px;--fs-small:12px}
  .app{gap:10px;padding-block:max(10px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-bottom,0px))}
  .app>*{width:100%;max-width:860px;align-self:center}
  .band{flex-wrap:wrap;gap:10px 14px;padding:12px 14px}
  .band-title{flex:1 1 100%}
  .band-name{font-size:20px;line-height:24px;white-space:normal}
  .band-rule{display:none}
  .band-btn{flex:1 1 130px}
  .alerts.top{display:none}
  .alerts.inline{display:grid;grid-template-columns:minmax(0,1fr)!important;gap:6px;padding:8px 12px}
  nav .alerts.inline{margin-bottom:8px}
  .views{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .body,.body.no-aside{display:flex;flex-direction:column;gap:0}
  .body>*{flex:1 1 auto}
  .body[data-view="step"]>nav,.body[data-view="step"]>aside,
  .body[data-view="steps"]>main,.body[data-view="steps"]>aside,
  .body[data-view="info"]>nav,.body[data-view="info"]>main{display:none}
  .main{padding:16px;gap:12px}
  .plates{flex:0 0 auto;height:190px}
  .btn{min-height:52px}
}
@media (max-width:599px){
  .band{padding:10px 12px;gap:8px 10px}
  .band-name{font-size:18px;line-height:22px}
  .band-state{display:none}
  .subject{flex:1 1 0;min-width:0;padding:4px 8px}
  .subject b,.subject span{overflow:hidden;text-overflow:ellipsis}
  .band-count b{font-size:18px;line-height:22px}
  .band-btn{flex:0 0 40px;width:40px;height:40px;padding:0}
  .band-btn span,.actions .btn:not(.go) span{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .actions .btn:not(.go){flex:0 0 56px;padding:0}
  .readout b{font-size:40px;line-height:40px}
  .copy h2{font-size:26px;line-height:30px}
  .lede{font-size:17px;line-height:25px}
  .plates{flex-direction:column;height:auto}
  .plate{flex:0 0 auto;height:176px}
  .route{flex-wrap:wrap;gap:4px}
  .route>.label{flex:0 0 100%;min-height:22px}
  .route .link{display:none}
  .node{flex:1 1 30%}
  .node b{white-space:normal}
  .btn.go{gap:10px;padding:0 14px}
  .btn.go span{font-size:14px}
}
@media (max-width:379px){
  .readout b{font-size:34px;line-height:34px}
  .readout span{font-size:17px}
  .step-head{gap:10px}
  .step-phase{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn.go{gap:8px;padding:0 10px}
  .btn.go b{font-size:20px}
  .btn.go span{font-size:13px;letter-spacing:.04em}
  .btn.go svg{display:none}
}
.readout{white-space:nowrap}
@media (prefers-reduced-motion:reduce){.app *{transition:none!important;animation:none!important}}

<script>
document.addEventListener('DOMContentLoaded', function () {
  'use strict';
  var app = document.getElementById('app');
  var root = document.documentElement;
  var problems = [];

  function readBlock(id) {
    var el = document.getElementById(id);
    if (!el || !el.textContent.trim()) return null;
    try { return JSON.parse(el.textContent); }
    catch (e) { problems.push('The #' + id + ' block is not valid JSON (' + e.message + ').'); return null; }
  }
  var job = readBlock('job') || {};
  var assets = readBlock('job-assets') || {};

  var steps = Array.isArray(job.steps) ? job.steps : [];
  var notes = job.notes || {};
  var photos = job.photos || {};
  var drawings = job.drawings || {};
  var icons = job.icons || {};
  var routeNodes = (job.route && Array.isArray(job.route.nodes)) ? job.route.nodes : [];
  var kit = Array.isArray(job.kit) ? job.kit : [];
  var why = job.why || null;
  var photoKeys = Object.keys(photos);
  var LEVELS = ['tip', 'warn', 'crit'];
  var WORD = { tip: 'Tip', warn: 'Warn', crit: 'Crit', ok: 'OK', run: 'Run', idle: 'Idle' };

  /* ---------- validation ---------- */
  (function validate() {
    var p = problems;
    if (job.schema !== 'job-console/1') p.push('Set "schema" to "job-console/1".');
    if (!job.id) p.push('Add an "id". Progress saves on the device under it.');
    if (!job.title) p.push('Add a "title".');
    if (!steps.length) p.push('Add at least one step to "steps".');
    (job.alerts || []).forEach(function (a, i) {
      if (!a || LEVELS.indexOf(a.level) < 0) p.push('Alert ' + (i + 1) + ' needs "level" set to crit, warn or tip.');
    });
    var nodeIds = routeNodes.map(function (n) { return n.id; });
    steps.forEach(function (s, i) {
      var n = 'Step ' + (i + 1);
      if (!s.title) p.push(n + ' has no "title".');
      if (!s.body) p.push(n + ' has no "body".');
      (s.notes || []).forEach(function (k) { if (!notes[k]) p.push(n + ' lists note "' + k + '", which is not in "notes".'); });
      (s.route || []).forEach(function (id) { if (nodeIds.indexOf(id) < 0) p.push(n + ' lights route node "' + id + '", which is not in "route.nodes".'); });
      var plates = s.plates || [];
      if (plates.length > 3) p.push(n + ' has ' + plates.length + ' plates. The row fits 3.');
      plates.forEach(function (pl, j) {
        var where = n + ', plate ' + (j + 1);
        if (pl.photo && !photos[pl.photo]) p.push(where + ' uses photo "' + pl.photo + '", which is not in "photos".');
        else if (pl.drawing && !drawings[pl.drawing]) p.push(where + ' uses drawing "' + pl.drawing + '", which is not in "drawings".');
        else if (!pl.photo && !pl.drawing) p.push(where + ' needs a "photo" or a "drawing".');
      });
    });
    Object.keys(notes).forEach(function (k) {
      var v = notes[k] || {};
      if (LEVELS.indexOf(v.level) < 0) p.push('Note "' + k + '" needs "level" set to tip, warn or crit.');
      else if (v.level !== 'tip' && !v.title) p.push('Note "' + k + '" is a ' + v.level + ' note and needs a "title".');
      if (!v.text) p.push('Note "' + k + '" has no "text".');
    });
    photoKeys.forEach(function (k) {
      var v = photos[k] || {};
      if (!v.src) p.push('Photo "' + k + '" has no "src".');
      ['src', 'thumb'].forEach(function (f) {
        if (v[f] && /^asset:/.test(v[f]) && !assets[v[f].slice(6)]) p.push('Photo "' + k + '" uses ' + v[f] + ', which is not in the #job-assets block.');
      });
      if (!v.alt) p.push('Photo "' + k + '" has no "alt" text.');
    });
    var seen = {};
    kit.forEach(function (sec) {
      (sec.items || []).forEach(function (it) {
        if (!it.id) { p.push('Kit item "' + (it.name || '?') + '" needs an "id".'); return; }
        if (seen[it.id]) p.push('Kit item id "' + it.id + '" is used twice.');
        seen[it.id] = true;
        if (it.photo && !photos[it.photo]) p.push('Kit item "' + it.id + '" uses photo "' + it.photo + '", which is not in "photos".');
        if (it.icon && !icons[it.icon]) p.push('Kit item "' + it.id + '" uses icon "' + it.icon + '", which is not in "icons".');
      });
    });
    if (why && why.photo && !photos[why.photo]) p.push('"why.photo" is "' + why.photo + '", which is not in "photos".');
  })();

  /* warn and crit notes become the Risks tab, linked to the first step that uses them */
  var firstStep = {};
  steps.forEach(function (s, i) { (s.notes || []).forEach(function (k) { if (!(k in firstStep)) firstStep[k] = i; }); });
  var risks = Object.keys(notes).filter(function (k) {
    return notes[k] && (notes[k].level === 'crit' || notes[k].level === 'warn') && (k in firstStep);
  }).sort(function (a, b) {
    return (notes[a].level === 'crit' ? 0 : 1) - (notes[b].level === 'crit' ? 0 : 1) || firstStep[a] - firstStep[b];
  });

  /* ---------- saved state (this device only) and #step-N links ---------- */
  var store = {
    read: function (k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    write: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage off: keep going */ } }
  };
  var KEY = 'job-console:' + (job.id || 'untitled');
  function blank() { return { cur: 0, done: steps.map(function () { return false; }), finished: false, kit: {}, tab: 'kit', view: 'step' }; }
  var S = blank();
  var saved = store.read(KEY);
  if (saved && Array.isArray(saved.done) && saved.done.length === steps.length) {
    S = Object.assign(blank(), saved);
    S.done = S.done.map(Boolean);
    S.cur = Math.min(Math.max(0, S.cur | 0), Math.max(0, steps.length - 1));
    S.finished = !!S.finished && S.done.every(Boolean);
    if (!S.kit || typeof S.kit !== 'object') S.kit = {};
  }
  function fromHash() {
    var hsh = window.location.hash || '';
    var m = /^#step-(\d{1,3})$/.exec(hsh);
    if (m) { var n = parseInt(m[1], 10); return (n >= 1 && n <= steps.length) ? { cur: n - 1, finished: false } : null; }
    if (hsh === '#done' && S.done.every(Boolean)) return { finished: true };
    return null;
  }
  var linked = fromHash();
  if (linked) Object.assign(S, linked, { view: 'step' });
  function syncHash() {
    if (!steps.length) return;
    var want = S.finished ? '#done' : '#step-' + (S.cur + 1);
    if (window.location.hash === want) return;
