  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #faf9f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>
    <style>#__bundler_loading { display: none; }</style>
    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">
      This page requires JavaScript to display.
    </div>
  </noscript>
</head>
<body>
  <div id="__bundler_placeholder">Loading PCV job console...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3pQPwl5FgsAXHNlYzg.woff2) format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(https://fonts.gstatic.com/s/ibmplexmono/v20/-F6qfjptAgt5VM-kVkqdyU8n3pQPwlBFgsAXHNk.woff2) format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0}\n.ft{--sans:\"Barlow\", ui-sans-serif, system-ui, \"Segoe UI\", Arial, sans-serif;--cond:\"Barlow Semi Condensed\", \"Arial Narrow\", ui-sans-serif, sans-serif;--mono:\"IBM Plex Mono\", ui-monospace, Menlo, Consolas, monospace;--band:#0b2d6b;--band-ink:#ffffff;--band-muted:#b9c9e8;--band-line:#3a5da3;--band-hover:#143d86}\n.ft-dark{color-scheme:dark;--ground:#050d1f;--panel:#0a1730;--card:#0e1d3b;--raised:#142852;--plate:#0b1834;--line:#1e3361;--line-strong:#2f4c86;--ink:#eef3fb;--ink-muted:#a8b7d3;--ink-dim:#8b9cbd;--accent:#6aa8ff;--go:#2259c9;--go-hover:#2a66de;--go-ink:#ffffff;--ok:#5ee08a;--warn:#ffb020;--crit:#ff6b62;--idle:#8b9cbd;--edge-ok:#1b5a3a;--edge-warn:#5a4414;--edge-crit:#5e2024;--readout:#dbe7ff}\n.ft-light{color-scheme:light;--ground:#e9eef5;--panel:#ffffff;--card:#ffffff;--raised:#eef3fa;--plate:#f4f7fb;--line:#d3dbe7;--line-strong:#9fb0c9;--ink:#0a1d40;--ink-muted:#42557a;--ink-dim:#55678b;--accent:#1d56c6;--go:#1d4fb8;--go-hover:#1a46a6;--go-ink:#ffffff;--ok:#12793a;--warn:#8f5b00;--crit:#c0261d;--idle:#55678b;--edge-ok:#b9dfc8;--edge-warn:#eed9a8;--edge-crit:#f1c3bf;--readout:#0b2d6b}\n.ft button{font-family:inherit;cursor:pointer;margin:0}\n.ft button:disabled{cursor:default}\n.ft button:focus-visible,.ft input:focus-visible,.ft a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.ft header button:focus-visible{outline-color:#ffffff}\n.ft .hov:hover{border-color:var(--line-strong) !important;background:var(--raised) !important}\n.ft .hovb:hover{background:var(--band-hover) !important}\n.ft .hovgo:hover{background:var(--go-hover) !important;border-color:var(--go-hover) !important}\n.ft a{color:var(--accent)}.ft a:hover{color:var(--ink)}\n/* responsive layout: the export was a fixed 1366x1024 canvas */\n@media (min-width: 1100px) {\n  .ft{width:100% !important;height:auto !important;min-height:100vh;overflow:visible !important}\n}\n@media (min-width: 1100px) and (max-width: 1365px) {\n  .ft-grid{grid-template-columns:300px minmax(0,1fr) 300px !important}\n}\n@media (max-width: 1099px) {\n  .ft{width:100% !important;height:auto !important;min-height:100vh;min-height:100dvh;overflow:visible !important;padding:10px !important;gap:10px !important}\n  .ft > header,.ft > section,.ft > .ft-grid{width:100%;max-width:860px;align-self:center;box-sizing:border-box}\n  .ft-head{height:auto !important;flex-wrap:wrap;padding:12px 14px !important;gap:10px 14px !important}\n  .ft-head > div:first-child{flex:1 1 100% !important}\n  .ft-head > div:first-child > span:last-child{font-size:20px !important;line-height:24px !important}\n  .ft-head > span[aria-hidden=\"true\"]{display:none !important}\n  .ft-head > button{flex:1 1 130px;justify-content:center}\n  .ft-alerts{grid-template-columns:minmax(0,1fr) !important;gap:6px !important;padding:8px 12px !important}\n  .ft-grid{display:flex !important;flex-direction:column;gap:10px !important}\n  .ft-main{order:1;padding:16px !important}\n  .ft-nav{order:2}\n  .ft-aside{order:3;overflow:visible !important}\n  .ft-plates{flex:0 0 auto !important;min-height:190px}\n  .ft-actions{position:sticky;bottom:0;z-index:5;margin-top:4px !important;padding:10px 0 calc(10px + env(safe-area-inset-bottom)) !important;background:var(--card)}\n  .ft [style*=\"font-size: 11px\"]{font-size:12px !important}\n  .ft [style*=\"font-size: 12px\"]{font-size:13px !important}\n}\n@media (max-width: 599px) {\n  .ft-head{padding:10px 12px !important;gap:8px 12px !important}\n  .ft-head > div:nth-child(3){display:none !important}\n  .ft-head > div:nth-child(5){margin-left:auto}\n  .ft-head > button{flex:1 1 140px;height:40px !important;padding:0 10px !important}\n  .ft-plates{flex-direction:column !important}\n  .ft-plates > figure{flex:0 0 auto !important;height:176px}\n  .ft-route{flex-wrap:wrap}\n  .ft-route > span:first-child{flex:0 0 100% !important;min-height:22px}\n  .ft-route > span[aria-hidden=\"true\"]{display:none !important}\n  .ft-route > div{margin-right:4px}\n  .ft-route > div:last-child{margin-right:0}\n  .ft .ft-route > div > span[style]{white-space:normal !important;font-size:11px !important;line-height:13px !important}\n  .ft-actions > button{padding:0 16px !important}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"{{themeClass}}\" style=\"width: 1366px; height: 1024px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; background: var(--ground); color: var(--ink); font-family: var(--sans)\" data-canvas-width=\"1366\" data-canvas-height=\"1024\" data-document-role=\"page\" data-label=\"Job console\">\n\n<header class=\"ft-head\" style=\"flex: 0 0 auto; display: flex; align-items: center; gap: 18px; height: 72px; box-sizing: border-box; padding: 0 20px; background: var(--band); color: var(--band-ink); border: 1px solid var(--band-line); border-radius: 8px\">\n  <div style=\"flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px\">\n    <span style=\"font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.14em; color: var(--band-muted)\">SERVICE PROCEDURE<\u002Fspan>\n    <span style=\"font-family: var(--cond); font-size: 24px; line-height: 28px; font-weight: 700; letter-spacing: 0.02em\">PCV VALVE AND BREATHER HOSES<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display: flex; flex-direction: column; gap: 1px; padding: 6px 12px; border: 1px solid var(--band-line); border-radius: 4px\">\n    <span style=\"font-family: var(--mono); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em\">2001 FOCUS<\u002Fspan>\n    <span style=\"font-family: var(--mono); font-size: 11px; line-height: 14px; font-weight: 500; color: var(--band-muted)\">2.0L DOHC ZETEC<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display: flex; align-items: center; gap: 8px; font-family: var(--cond); font-size: 14px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em\">\n    <sc-if value=\"{{topOk}}\" hint-placeholder-val=\"{{false}}\"><span aria-hidden=\"true\" style=\"display: block; width: 8px; height: 8px; border-radius: 50%; background: #5ee08a\"><\u002Fspan><\u002Fsc-if>\n    <sc-if value=\"{{topIdle}}\" hint-placeholder-val=\"{{false}}\"><span aria-hidden=\"true\" style=\"display: block; width: 8px; height: 8px; background: var(--band-muted)\"><\u002Fspan><\u002Fsc-if>\n    <sc-if value=\"{{topRun}}\" hint-placeholder-val=\"{{true}}\"><span aria-hidden=\"true\" style=\"display: block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 50%; border: 2px solid #ffffff\"><\u002Fspan><\u002Fsc-if>\n    <span>{{topPhase}}<\u002Fspan>\n  <\u002Fdiv>\n  <span aria-hidden=\"true\" style=\"display: block; width: 1px; height: 36px; background: var(--band-line)\"><\u002Fspan>\n  <div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 2px\">\n    <span style=\"font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--band-muted)\">STEPS DONE<\u002Fspan>\n    <span style=\"font-family: var(--mono); font-size: 20px; line-height: 24px; font-weight: 600; font-variant-numeric: tabular-nums\">{{doneText}}<\u002Fspan>\n  <\u002Fdiv>\n  <button type=\"button\" class=\"hovb\" sc-camel-on-click=\"{{reset}}\" style=\"display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--band-line); background: transparent; color: var(--band-ink); font-family: var(--cond); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em\">\n    <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 1 0 3-6.7\"><\u002Fpath><path d=\"M3 4v5h5\"><\u002Fpath><\u002Fsvg>\n    <span>RESET STEPS<\u002Fspan>\n  <\u002Fbutton>\n  <button type=\"button\" class=\"hovb\" sc-camel-on-click=\"{{toggleTheme}}\" aria-label=\"{{themeAria}}\" style=\"display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--band-line); background: transparent; color: var(--band-ink); font-family: var(--cond); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em\">\n    <sc-if value=\"{{isDark}}\" hint-placeholder-val=\"{{true}}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n    <sc-if value=\"{{isLight}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n    <span>{{themeLabel}}<\u002Fspan>\n  <\u002Fbutton>\n<\u002Fheader>\n\n<section class=\"ft-alerts\" aria-label=\"Job alerts\" style=\"flex: 0 0 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 10px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px\">\n  <div style=\"display: flex; align-items: center; gap: 12px; min-height: 36px\">\n    <span style=\"flex: 0 0 72px; display: flex; align-items: center; gap: 8px; color: var(--crit); font-family: var(--cond); font-size: 14px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.3 3.9 2.4 17.5a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><path d=\"M12 9.5v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n      <span>CRIT<\u002Fspan>\n    <\u002Fspan>\n    <span style=\"font-size: 14px; line-height: 18px; font-weight: 500\">Replace all three parts together. The rear breather hose is usually the part that collapses and creates the pressure that pushes oil out.<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display: flex; align-items: center; gap: 12px; min-height: 36px\">\n    <span style=\"flex: 0 0 72px; display: flex; align-items: center; gap: 8px; color: var(--warn); font-family: var(--cond); font-size: 14px; line-height: 16px; font-weight: 700; letter-spacing: 0.08em\">\n      <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.3 3.9 2.4 17.5a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><path d=\"M12 9.5v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n      <span>WARN<\u002Fspan>\n    <\u002Fspan>\n    <span style=\"font-size: 14px; line-height: 18px; font-weight: 500\">Avoid pulling hard on nearby plastic lines. EVAP components break easily.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"ft-grid\" style=\"flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr) 340px; gap: 12px\">\n\n  <nav class=\"ft-nav\" aria-label=\"Steps\" style=\"min-height: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px\">\n    <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n      <span style=\"font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted)\">PROCEDURE<\u002Fspan>\n      <span style=\"font-family: var(--mono); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted)\">11 STEPS<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-direction: column; gap: 4px\">\n      <sc-for list=\"{{cues}}\" as=\"cue\" hint-placeholder-count=\"11\">\n        <sc-if value=\"{{cue.showPhase}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"padding: 10px 4px 4px; font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted)\">{{cue.phase}}<\u002Fdiv>\n        <\u002Fsc-if>\n        <button type=\"button\" class=\"{{cue.cls}}\" sc-camel-on-click=\"{{cue.pick}}\" aria-current=\"{{cue.ariaCurrent}}\" style=\"display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; min-height: 46px; box-sizing: border-box; padding: 4px 10px; ed)\">PREVENTION<\u002Fspan>\n                  <span style=\"font-size: 14px; line-height: 20px; color: var(--ink-muted)\">{{note.fix}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{note.isTip}}\" hint-placeholder-val=\"{{true}}\">\n              <div style=\"display: flex; gap: 12px; align-items: baseline; padding: 12px 14px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line)\">\n                <span style=\"flex: 0 0 auto; font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--accent)\">TIP<\u002Fspan>\n                <span style=\"font-size: 14px; line-height: 20px; color: var(--ink)\">{{note.text}}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div class=\"ft-actions\" style=\"display: flex; gap: 12px; margin-top: auto\">\n          <button type=\"button\" class=\"hov\" sc-camel-on-click=\"{{back}}\" disabled=\"{{backDisabled}}\" style=\"display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: 0 24px; border-radius: 6px; border: 1px solid {{backEdge}}; background: var(--raised); color: {{backInk}}; font-family: var(--cond); font-size: 15px; line-height: 18px; font-weight: 600; letter-spacing: 0.08em\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5\"><\u002Fpath><path d=\"M11 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg>\n            <span>BACK<\u002Fspan>\n          <\u002Fbutton>\n          <button type=\"button\" class=\"hovgo\" sc-camel-on-click=\"{{go}}\" style=\"flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 56px; padding: 0 24px; border-radius: 6px; bor         <p style=\"margin: 0; max-width: 520px; font-size: 18px; line-height: 27px; color: var(--ink-muted); text-wrap: pretty\">Recheck the coolant level after a full warm-up cycle, and look over every new connection for vacuum leaks or oil seepage.<\u002Fp>\n        <div style=\"display: flex; gap: 12px\">\n          <button type=\"button\" class=\"hov\" sc-camel-on-click=\"{{back}}\" style=\"display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 24px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); font-family: var(--cond); font-size: 15px; line-height: 18px; font-weight: 600; letter-spacing: 0.08em\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M19 12H5\"><\u002Fpath><path d=\"M11 6l-6 6 6 6\"><\u002Fpath><\u002Fsvg>\n            <span>BACK TO STEPS<\u002Fspan>\n          <\u002Fbutton>\n          <button type=\"button\" class=\"hov\" sc-camel-on-click=\"{{reset}}\" style=\"display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 24px; border-radius: 6px; border: 1px solid var(--line-strong); background: var(--raised); color: var(--ink); font-family: var(--cond); font-size: 15px; line-height: 18px; font-weight: 600; letter-spacing: 0.08em\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12a9 9 0 1 0 3-6.7\"><\u002Fpath><path d=\"M3 4v5h5\"><\u002Fpath><\u002Fsvg>\n            <span>RESET STEPS<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fmain>\n\n  <aside class=\"ft-aside\" aria-label=\"Job reference\" style=\"min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden\">\n    <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px\">\n      <sc-for list=\"{{tabs}}\" as=\"tab\" hint-placeholder-count=\"4\">\n        <button type=\"button\" class=\"{{tab.cls}}\" sc-camel-on-click=\"{{tab.pick}}\" aria-pressed=\"{{tab.pressed}}\" style=\"min-height: 44px; border-radius: 6px; border: 1px solid {{tab.edge}}; background: {{tab.bg}}; color: {{tab.ink}}; font-family: var(--cond); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.1em\">{{tab.label}}<\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{tabKit}}\" hint-placeholder-val=\"{{true}}\">\n      <div style=\"min-height: 0; display: flex; flex-direction: column; gap: 12px\">\n        <section style=\"display: flex; flex-direction: column\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px\">\n            <span style=\"font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted)\">BEFORE YOU START<\u002Fspan>\n            <span style=\"font-family: var(--mono); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted)\">{{preCount}}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{pre}}\" as=\"it\" hint-placeholder-count=\"2\">\n            <label style=\"display: flex; align-items: center; gap: 10px; min-height: 52px; box-sizing: border-box; padding: 6px 4px; border-bottom: 1px solid var(--line); cursor: pointer\">\n              <input type=\"checkbox\" checked=\"{{it.on}}\" sc-camel-on-change=\"{{it.toggle}}\" style=\"flex: 0 0 auto; width: 20px; height: 20px; margin: 0; accent-color: var(--accent)\">\n              <span style=\"font-size: 14px; line-height: 20px; color: {{it.ink}}\">{{it.name}}<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fsection>\n        <section style=\"display: flex; flex-direction: column\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px\">\n            <span style=\"font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted)\">PARTS ON HAND<\u002Fspan>\n            <span style=\"font-family: var(--mono); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted)\">{{partsCount}}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{parts}}\" as=\"it\" hint-placeholder-count=\"3\">\n            <label style=\"display: flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; border-bottom: 1px solid var(--line); cursor: pointer\">\n              <input type=\"checkbox\" checked=\"{{it.on}}\" sc-camel-on-change=\"{{it.toggle}}\" style=\"flex: 0 0 auto; width: 20px; height: 20px; margin: 0; accent-color: var(--accent)\">\n              <span style=\"flex: 0 0 44px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 4px; overflow: hidden; background: var(--raised); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink)\">\n                <sc-if value=\"{{it.hasThumb}}\" hint-placeholder-val=\"{{false}}\"><img decoding=\"async\" sc-camel-src=\"{{it.thumbSrc}}\" alt=\"\" style=\"display: block; width: 100%; height: 100%; object-fit: cover\"><\u002Fsc-if>\n                <sc-if value=\"{{it.iElbow}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 40 V24 Q14 12 26 12 H40 M24 40 V26 Q24 22 28 22 H40 M14 40 H24 M40 12 V22\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <sc-if value=\"{{it.iSleeve}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 17 H40 M6 31 H40\"><\u002Fpath><ellipse cx=\"6\" cy=\"24\" rx=\"3\" ry=\"7\"><\u002Fellipse><ellipse cx=\"40\" cy=\"24\" rx=\"3\" ry=\"7\"><\u002Fellipse><path d=\"M13 31 l4 -14 M20 31 l4 -14 M27 31 l4 -14\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <\u002Fspan>\n              <span style=\"min-width: 0; display: flex; flex-direction: column; gap: 1px; color: {{it.ink}}\">\n                <span style=\"font-size: 14px; line-height: 19px; font-weight: 600\">{{it.name}}<\u002Fspan>\n                <sc-if value=\"{{it.hasNote}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-size: 13px; line-height: 17px; color: var(--ink-muted)\">{{it.note}}<\u002Fspan><\u002Fsc-if>\n              <\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fsection>\n        <section style=\"display: flex; flex-direction: column\">\n          <div style=\"display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px\">\n            <span style=\"font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted)\">TOOLS<\u002Fspan>\n            <span style=\"font-family: var(--mono); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted)\">{{toolsCount}}<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{tools}}\" as=\"it\" hint-placeholder-count=\"5\">\n            <label style=\"display: flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 6px 4px; border-bottom: 1px solid var(--line); cursor: pointer\">\n              <input type=\"checkbox\" checked=\"{{it.on}}\" sc-camel-on-change=\"{{it.toggle}}\" style=\"flex: 0 0 auto; width: 20px; height: 20px; margin: 0; accent-color: var(--accent)\">\n              <span style=\"flex: 0 0 44px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 4px; overflow: hidden; background: var(--raised); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; color: var(--ink)\">\n                <sc-if value=\"{{it.hasThumb}}\" hint-placeholder-val=\"{{false}}\"><img decoding=\"async\" sc-camel-src=\"{{it.thumbSrc}}\" alt=\"\" style=\"display: block; width: 100%; height: 100%; object-fit: cover\"><\u002Fsc-if>\n                <sc-if value=\"{{it.iKnife}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 28 L16 18 H26 V28 Z M26 16 H40 Q42 16 42 18 V28 Q42 30 40 30 H26 Z\"><\u002Fpath><path d=\"M8 38 H34 Q38 38 38 34\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <sc-if value=\"{{it.iJug}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 14 H30 L36 20 V40 Q36 42 34 42 H14 Q12 42 12 40 V16 Q12 14 14 14 Z M18 14 V8 H26 V14\"><\u002Fpath><path d=\"M12 28 H36\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                <sc-if value=\"{{it.iRag}}\" hint-placeholder-val=\"{{false}}\"><svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 48 48\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 14 Q16 10 24 14 T40 14 V36 Q32 40 24 36 T8 36 Z\"><\u002Fpath><path d=\"M8 25 Q16 21 24 25 T40 25\" stroke-width=\"1.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <\u002Fspan>\n              <span style=\"min-width: 0; display: flex; flex-direction: column; gap: 1px; color: {{it.ink}}\">\n                <span style=\"font-size: 14px; line-height: 19px; font-weight: 600\">{{it.name}}<\u002Fspan>\n                <sc-if value=\"{{it.hasNote}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-size: 13px; line-height: 17px; color: var(--ink-muted)\">{{it.note}}<\u002Fspan><\u002Fsc-if>\n              <\u002Fspan>\n            <\u002Flabel>\n          <\u002Fsc-for>\n        <\u002Fsection>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tabWhy}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"min-height: 0; display: flex; flex-direction: column; gap: 16px\">\n        <figure style=\"margin: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 6px; overflow: hidden\">\n          <div style=\"position: relative; height: 150px; overflow: hidden\">\n            <img decoding=\"async\" sc-camel-src=\"/ford/img/engine.jpg\" alt=\"Top view of a 2.0 Zetec engine bay in a 2004 Focus, radiator at the bottom, firewall at the top\" style=\"display: block; width: 100%; height: 100%; object-fit: cover\">\n            <span style=\"position: absolute; top: 8px; left: 8px; padding: 3px 6px; border-radius: 3px; background: rgba(5, 13, 31, 0.8); color: #ffffff; font-family: var(--cond); font-size: 11px; line-height: 13px; font-weight: 600; letter-spacing: 0.1em\">FIREWALL<\u002Fspan>\n            <span style=\"position: absolute; bottom: 8px; left: 8px; padding: 3px 6px; border-radius: 3px; background: rgba(5, 13, 31, 0.8); color: #ffffff; font-family: var(--cond); font-size: 11px; line-height: 13px; font-weight: 600; letter-spacing: 0.1em\">RADIATOR<\u002Fspan>\n          <\u002Fdiv>\n          <figcaption style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 30px; padding: 0 10px; border-top: 1px solid var(--line); background: var(--card)\">\n            <span style=\"font-family: var(--cond); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em\">2.0 Zetec, 2004 Focus<\u002Fspan>\n            <span style=\"font-family: var(--mono); font-size: 11px; line-height: 14px; font-weight: 500; color: var(--ink-dim)\">CC0<\u002Fspan>\n          <\u002Ffigcaption>\n        <\u002Ffigure>\n        <section style=\"display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted)\">THE FAILURE<\u002Fspan>\n          <p style=\"margin: 0; font-size: 14px; line-height: 21px; color: var(--ink); text-wrap: pretty\">These parts are a common failure point on this engine. Engine heat softens the rear breather hose over time. Once it collapses under vacuum, crankcase pressure rises and forces oil past gaskets, often the valve cover.<\u002Fp>\n        <\u002Fsection>\n        <section style=\"display: flex; flex-direction: column; gap: 6px\">\n          <span style=\"font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted)\">SYMPTOMS<\u002Fspan>\n          <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px\">\n            <span style=\"display: flex; align-items: center; min-height: 34px; box-sizing: border-box; padding: 6px 10px; border-radius: 4px; background: var(--raised); border: 1px solid var(--line); font-family: var(--cond); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em\">VISIBLE OIL LEAKS<\u002Fspan>\n            <span style=\"display: flex; align-items: center; min-height: 34px; box-sizing: border-box; padding: 6px 10px; border-radius: 4px; background: var(--raised); border: 1px solid var(--line); font-family: var(--cond); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em\">OILY RESIDUE ON ENGINE<\u002Fspan>\n            <span style=\"display: flex; align-items: center; min-height: 34px; box-sizing: border-box; padding: 6px 10px; border-radius: 4px; background: var(--raised); border: 1px solid var(--line); font-family: var(--cond); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em\">ROUGH IDLE<\u002Fspan>\n            <span style=\"display: flex; align-items: center; min-height: 34px; box-sizing: border-box; padding: 6px 10px; border-radius: 4px; background: var(--raised); border: 1px solid var(--line); font-family: var(--cond); font-size: 13px; line-height: 16px; font-weight: 600; letter-spacing: 0.04em\">LEAN CODES<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"display: flex; flex-direction: column\">\n          <span style=\"padding-bottom: 4px; font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted)\">RUN THIS JOB WHEN<\u002Fspan>\n          <div style=\"padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 20px\">Oil leaks started after high mileage<\u002Fdiv>\n          <div style=\"padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 20px\">You hear a hissing sound near the rear of the engine<\u002Fdiv>\n          <div style=\"padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px; line-height: 20px\">Preventive maintenance on a high-mileage Focus<\u002Fdiv>\n        <\u002Fsection>\n        <p style=\"margin: 0; font-size: 14px; line-height: 21px; color: var(--ink-muted); text-wrap: pretty\">Replacing all three parts together addresses the most frequent failure points in the system.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tabRisks}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"min-height: 0; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n          <span style=\"font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted)\">COMMON MISTAKES<\u002Fspan>\n          <span style=\"font-family: var(--mono); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted)\">TAP TO JUMP<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{risks}}\" as=\"r\" hint-placeholder-count=\"4\">\n          <button type=\"button\" class=\"hov\" sc-camel-on-click=\"{{r.jump}}\" aria-label=\"{{r.aria}}\" style=\"display: flex; flex-direction: column; align-items: stretch; gap: 6px; width: 100%; box-sizing: border-box; padding: 12px 14px; text-align: left; border-radius: 6px; background: var(--card); border: 1px solid {{r.edge}}; color: var(--ink)\">\n            <span style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n              <span style=\"display: inline-flex; align-items: center; gap: 4px; padding: 3px 7px; border-radius: 4px; border: 1px solid {{r.edge}}; color: {{r.color}}; font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 700; letter-spacing: 0.08em\">\n                <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.3 3.9 2.4 17.5a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><path d=\"M12 9.5v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n                <span>{{r.word}}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-family: var(--mono); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted)\">{{r.stepLabel}}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-size: 15px; line-height: 20px; font-weight: 600\">{{r.title}}<\u002Fspan>\n            <span style=\"font-size: 13px; line-height: 18px; color: var(--ink-muted)\">{{r.fix}}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{tabPhotos}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"min-height: 0; display: flex; flex-direction: column; gap: 10px\">\n        <div style=\"display: flex; justify-content: space-between; align-items: baseline\">\n          <span style=\"font-family: var(--cond); font-size: 12px; line-height: 14px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-muted)\">PHOTO CREDITS<\u002Fspan>\n          <span style=\"font-family: var(--mono); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted)\">WIKIMEDIA COMMONS<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{credits}}\" as=\"c\" hint-placeholder-count=\"6\">\n          <div style=\"display: flex; gap: 10px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line)\">\n            <img decoding=\"async\" sc-camel-src=\"{{c.src}}\" alt=\"\" style=\"flex: 0 0 72px; display: block; width: 72px; height: 54px; object-fit: cover; border-radius: 4px; border: 1px solid var(--line)\">\n            <div style=\"min-width: 0; display: flex; flex-direction: column; gap: 1px\">\n              <a href=\"{{c.page}}\" target=\"_blank\" rel=\"noopener\" style=\"font-size: 14px; line-height: 19px; font-weight: 600\">{{c.what}}<\u002Fa>\n              <span style=\"font-size: 12px; line-height: 16px; color: var(--ink-muted)\">{{c.author}}<\u002Fspan>\n              <span style=\"font-family: var(--mono); font-size: 11px; line-height: 14px; font-weight: 500; color: var(--ink-dim)\">{{c.license}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <p style=\"margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted)\">Line drawings are original to this guide. Reference photos show typical parts and the same engine family, not this exact car.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Faside>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;step&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:11,&quot;step&quot;:1,&quot;section&quot;:&quot;Preview&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;dark&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;section&quot;:&quot;Preview&quot;},&quot;panel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;kit&quot;,&quot;options&quot;:[&quot;kit&quot;,&quot;why&quot;,&quot;risks&quot;,&quot;photos&quot;],&quot;section&quot;:&quot;Preview&quot;},&quot;$preview&quot;:{&quot;width&quot;:1366,&quot;height&quot;:1024}}\">\nconst STORE_KEY = 'nnp.ford.pcv.v1';\nconst STEP_COUNT = 11;\nconst KIT_IDS = ['pre1', 'pre2', 'p1', 'p2', 'p3', 't1', 't2', 't3', 't4', 't5'];\n\nfunction readStore() {\n  try {\n    const raw = window.localStorage.getItem(STORE_KEY);\n    const saved = raw ? JSON.parse(raw) : null;\n    return saved && typeof saved === 'object' ? saved : null;\n  } catch (e) { return null; }\n}\n\nfunction writeStore(value) {\n  try { window.localStorage.setItem(STORE_KEY, JSON.stringify(value)); } catch (e) { /* storage blocked */ }\n}\n\nfunction stepFromHash() {\n  const m = /^#step-(\\d{1,2})$/.exec(window.location.hash || '');\n  const n = m ? parseInt(m[1], 10) : 0;\n  return n >= 1 && n <= STEP_COUNT ? n - 1 : null;\n}\n\nfunction restoreState() {\n  const saved = readStore() || {};\n  const st = {};\n  if (Array.isArray(saved.done) && saved.done.length === STEP_COUNT) st.done = saved.done.map(Boolean);\n  if (saved.kit && typeof saved.kit === 'object') {\n    st.kit = {};\n    for (const id of KIT_IDS) if (saved.kit[id] === true) st.kit[id] = true;\n  }\n  if (saved.theme === 'light' || saved.theme === 'dark') st.theme = saved.theme;\n  if (Number.isInteger(saved.cur) && saved.cur >= 0 && saved.cur < STEP_COUNT) st.cur = saved.cur;\n  const hashStep = stepFromHash();\n  if (hashStep !== null) {\n    st.cur = hashStep;\n  } else if (saved.finished === true && st.done && st.done.every(Boolean)) {\n    st.finished = true;\n  }\n  return st;\n}\n\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = Object.assign({}, this.state, restoreState());\n  }\n\n  componentDidMount() {\n    this.lastCur = this.snapshot().cur;\n    this.onHash = () => {\n      const n = stepFromHash();\n      if (n === null) return;\n      const snap = this.snapshot();\n      if (n !== snap.cur || snap.finished) this.setState({ cur: n, finished: false });\n    };\n    window.addEventListener('hashchange', this.onHash);\n    this.persist();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('hashchange', this.onHash);\n  }\n\n  snapshot() {\n    const s = this.state || {};\n    const start = Math.min(STEP_COUNT, Math.max(1, Math.round(this.props.step ?? 1))) - 1;\n    return {\n      cur: s.cur ?? start,\n      done: s.done ?? null,\n      kit: s.kit || {},\n      theme: s.theme ?? this.props.theme ?? 'dark',\n      finished: !!s.finished\n    };\n  }\n\n  persist() {\n    const snap = this.snapshot();\n    writeStore(snap);\n    const hash = snap.finished ? '#done' : '#step-' + (snap.cur + 1);\n    if (window.location.hash === hash) return;\n    try { window.history.replaceState(null, '', window.location.pathname + window.location.search + hash); } catch (e) { /* ignore */ }\n  }\n\n  componentDidUpdate(prev) {\n    if (prev.step !== this.props.step) this.setState({ cur: undefined, done: undefined, finished: false });\n    if (prev.theme !== this.props.theme) this.setState({ theme: undefined });\n    if (prev.panel !== this.props.panel) this.setState({ tab: undefined });\n    this.persist();\n    const cur = this.snapshot().cur;\n    if (cur !== this.lastCur) {\n      this.lastCur = cur;\n      // stacked layout: bring the new step back to the top of the screen\n      const stacked = window.matchMedia && window.matchMedia('(max-width: 1099px)').matches;\n      const main = document.querySelector('.ft-main');\n      if (stacked && main && main.scrollIntoView) main.scrollIntoView({ block: 'start' });\n    }\n  }\n\n  data() {\n    return {\n      photos: {\n        engine: { src: '/ford/img/engine.jpg', thumb: '/ford/img/thumb-engine.jpg', alt: 'Top view of a 2.0 Zetec engine bay in a 2004 Focus, radiator at the bottom, firewall at the top', what: '2.0 Zetec engine bay, 2004 Focus', author: 'Dezzier 1596', license: 'CC0', short: 'CC0', page: 'https://commons.wikimedia.org/wiki/File:2.0_Zetec_Engine.png' },\n        pcvflow: { src: '/ford/img/pcv-valve.jpg', thumb: '/ford/img/thumb-pcv-valve.jpg', alt: 'Typical inline PCV valve labeled from crankcase to intake manifold', what: 'Typical inline PCV valve', author: 'Flippythedragonslayer', license: 'CC BY-SA 4.0, cropped', short: 'CC BY-SA', page: 'https://commons.wikimedia.org/wiki/File:PCV_valve.jpg' },\n        springclamp: { src: '/ford/img/spring-clamps.jpg', thumb: '/ford/img/thumb-spring-clamps.jpg', alt: 'Two spring-type hose clamps', what: 'Spring hose clamps', author: 'Bushytails at English Wikipedia', license: 'CC BY-SA 3.0', short: 'CC BY-SA', page: 'https://commons.wikimedia.org/wiki/File:Two_spring_Hose_Clamps_-_small.jpg' },\n        wormclamp: { src: '/ford/img/worm-clamps.jpg', thumb: '/ford/img/thumb-worm-clamps.jpg', alt: 'Assorted worm-drive hose clamps', what: 'Worm-drive hose clamps', author: 'ArnoldReinhold', license: 'CC BY-SA 3.0', short: 'CC BY-SA', page: 'https://commons.wikimedia.org/wiki/File:Hoseclamps.screw.agr.jpg' },\n        sockets: { src: '/ford/img/sockets.jpg', thumb: '/ford/img/thumb-sockets.jpg', alt: 'Socket set with ratchet and extensions', what: 'Socket set and ratchet', author: 'Blaine Maber at en.wikipedia', license: 'Public domain', short: 'PD', page: 'https://commons.wikimedia.org/wiki/File:Socket_wrench_set.jpg' },\n        flashlight: { src: '/ford/img/flashlight.jpg', thumb: '/ford/img/thumb-flashlight.jpg', alt: 'Black flashlight', what: 'Flashlight', author: 'KMJ at German Wikipedia', license: 'CC BY-SA 3.0', short: 'CC BY-SA', page: 'https://commons.wikimedia.org/wiki/File:Flashlight.jpg' }\n      },\n      photoOrder: ['engine', 'pcvflow', 'springclamp', 'wormclamp', 'sockets', 'flashlight'],\n      steps: [\n        { phase: 'PREP', title: 'Make the car safe', nodes: [], notes: [],\n          plates: [{ draw: 'battery', cap: 'Negative cable off first' }],\n          body: 'Park the car on a level surface, set the parking brake, and let the engine cool completely. Disconnect the negative battery cable for safety.' },\n        { phase: 'FRONT REMOVAL', title: 'Find the front PCV parts', nodes: ['valve', 'elbow', 'pipe'], notes: [],\n          plates: [{ photo: 'engine', annot: true, cap: '2.0 Zetec, top view' }, { photo: 'pcvflow', cap: 'Typical inline PCV valve' }],\n          body: 'Open the hood and locate the front PCV components. The PCV valve sits near the front of the engine (often low and slightly toward the exhaust/thermostat area). The 90-degree elbow hose connects the valve to a metal pipe.' },\n        { phase: 'FRONT REMOVAL', title: 'Pull the old valve and elbow', nodes: ['valve', 'elbow'], notes: ['tipElbow'],\n          plates: [{ photo: 'pcvflow', cap: 'Flow: crankcase to intake' }, { draw: 'pull', cap: 'Note orientation, then pull' }],\n          body: 'Carefully pull the old PCV valve out of its grommet or oil separator. Disconnect and remove the old 90-degree elbow hose. Note the orientation before removal.' },\n        { phase: 'REAR HOSE', title: 'Find the rear breather hose', nodes: ['pipe', 'hose', 'intake'], notes: ['tipMirror'],\n          plates: [{ photo: 'engine', annot: true, cap: 'Behind the intake, toward firewall' }, { draw: 'mirror', cap: 'Work light plus a small mirror' }],\n          body: 'Use a work light to locate the rear PCV breather hose. It runs behind the intake manifold toward the firewall. One end connects to the metal pipe/tube that runs under the thermostat area; the other end connects to the intake manifold.' },\n        { phase: 'REAR HOSE', title: 'Disconnect the old rear hose', nodes: ['pipe', 'hose', 'intake'], notes: ['mForce'],\n          plates: [{ draw: 'slit', cap: 'Stuck or brittle: slit it' }, { photo: 'springclamp', cap: 'Spring clamps, hard to reach' }],\n          body: 'Disconnect both ends of the old rear hose. Spring clamps are common and hard to reach. If the hose is stuck or brittle, carefully slit it lengthwise with a utility knife rather than forcing it. Avoid pulling hard on nearby plastic lines (EVAP components break easily).' },\n        { phase: 'REAR HOSE', title: 'Remove the old hose and clean', nodes: ['pipe', 'hose', 'intake'], notes: ['mRoot'],\n          plates: [{ draw: 'clean', cap: 'Old hose out, both ends clean' }],\n          body: 'Remove the old collapsed rear hose completely. Clean the connection points on the metal pipe and intake manifold.' },\n        { phase: 'REAR HOSE', title: 'Fit the new rear hose', nodes: ['pipe', 'hose', 'intake'], notes: ['tipLube', 'tipClamp'],\n          plates: [{ draw: 'order', cap: 'Intake end first, then the pipe' }, { photo: 'wormclamp', cap: 'Worm-drive clamps' }],\n          body: 'Route the new rear breather hose into position. Connect the intake-manifold end first and secure it firmly (replace a damaged spring clamp with a worm-drive clamp if needed). Then connect the other end to the metal pipe.' },\n        { phase: 'FRONT INSTALL', title: 'Seat the new elbow', nodes: ['elbow', 'pipe'], notes: ['mSeat', 'tipLube'],\n          plates: [{ draw: 'seat', cap: 'Push until it bottoms out' }],\n          body: 'Install the new 90-degree elbow hose fully onto the metal pipe. Push until it is completely seated with no gap.' },\n        { phase: 'FRONT INSTALL', title: 'Install the new PCV valve', nodes: ['valve', 'elbow'], notes: [],\n          plates: [{ draw: 'push', cap: 'Push until it locks or seats' }, { photo: 'pcvflow', cap: 'Crankcase end into the grommet' }],\n          body: 'Install the new PCV valve. Push it fully into the grommet until it locks or seats properly, then confirm the elbow is secure on the valve.' },\n        { phase: 'CLOSE OUT', title: 'Reconnect and top off', nodes: [], notes: ['mCool'],\n          plates: [{ draw: 'coolant', cap: 'Top off coolant, reconnect battery' }],\n          body: 'Reconnect any coolant or auxiliary hoses you moved. Top off the coolant if any was lost. Reconnect the battery.' },\n        { phase: 'CLOSE OUT', title: 'Start and check for leaks', nodes: ['valve', 'elbow', 'hose'], notes: [],\n          plates: [{ draw: 'idle', cap: 'Idle, listen, look' }],\n          body: 'Start the engine and let it idle. Check all new connections for vacuum leaks or oil seepage. Listen for hissing and confirm the engine idles smoothly. Recheck coolant level after the engine reaches operating temperature.' }\n      ],\n      notes: {\n        tipElbow: { kind: 'tip', text: 'Inspect the elbow hose closely even if it looks intact. Heat and oil make it brittle and prone to cracking.' },\n        tipMirror: { kind: 'tip', text: 'A bright work light and a small mirror make the rear connection far easier. The space is dark and tight.' },\n        tipLube: { kind: 'tip', text: 'Lightly lubricate the ends of the new hoses with soapy water or a tiny amount of silicone grease so they slide on without tearing.' },\n        tipClamp: { kind: 'tip', text: 'If the original spring clamp on the intake end is stubborn, replace it with a standard worm-drive hose clamp for easier future service.' },\n        mRoot: { kind: 'crit', step: 6, title: 'Only replacing the PCV valve and elbow',\n          text: 'The rear breather hose is usually the part that collapses and creates the pressure that pushes oil out. Leaving it in place leaves the root cause unfixed.',\n          fix: 'Replace all three parts together.' },\n        mForce: { kind: 'warn', step: 5, title: 'Forcing brittle old hoses and plastics',\n          text: 'High-mileage rubber and plastic lines (especially EVAP tubing) snap easily.',\n          fix: 'Slit stuck hoses with a knife and work slowly; keep spare EVAP line material on hand if lines look cracked.' },\n        mSeat: { kind: 'warn', step: 8, title: 'Not fully seating the 90-degree elbow',\n          text: 'A partial connection creates a vacuum leak that causes rough idle or lean codes.',\n          fix: 'Push the elbow until it bottoms out and visually confirm no gap remains.' },\n        mCool: { kind: 'warn', step: 10, title: 'Skipping the coolant check',\n          text: 'Disturbing nearby cooling hoses can cause a slow leak or air pocket.',\n          fix: 'Top off coolant and verify the level after a full warm-up cycle.' }\n      },\n      route: [\n        { id: 'valve', label: 'PCV VALVE', tag: 'REPLACE' },\n        { id: 'elbow', label: '90° ELBOW', tag: 'REPLACE' },\n        { id: 'pipe', label: 'METAL PIPE', tag: 'KEEP' },\n        { id: 'hose', label: 'REAR HOSE', tag: 'REPLACE' },\n        { id: 'intake', label: 'INTAKE', tag: 'KEEP' }\n      ],\n      pre: [\n        { id: 'pre1', name: 'Order the insulated rear hose, elbow and PCV valve for the 2.0L DOHC' },\n        { id: 'pre2', name: 'Inspect the rear hose and elbow with a work light for collapse or cracking' }\n      ],\n      parts: [\n        { id: 'p1', name: 'PCV valve', note: 'Motorcraft or equivalent for the 2.0L DOHC', thumb: 'pcvflow' },\n        { id: 'p2', name: '90-degree elbow hose', note: '', icon: 'elbow' },\n        { id: 'p3', name: 'Rear PCV breather hose', note: 'Heat-resistant insulated version with the factory-style sleeve. Unprotected hoses collapse again quickly.', icon: 'sleeve' }\n      ],\n      tools: [\n        { id: 't1', name: 'Work light or bright flashlight', note: '', thumb: 'flashlight' },\n        { id: 't2', name: 'Basic hand tools', note: 'Sockets, ratchets, extensions, and wrenches', thumb: 'sockets' },\n        { id: 't3', name: 'Utility knife or pick', note: 'For cutting or prying stuck hoses', icon: 'knife' },\n        { id: 't4', name: 'Coolant', note: 'A precaution if any cooling hoses are disturbed', icon: 'jug' },\n        { id: 't5', name: 'Shop rags', note: '', icon: 'rag' }\n      ]\n    };\n  }\n\n  renderVals() {\n    const D = this.data();\n    const s = this.state || {};\n    const steps = D.steps;\n    const total = steps.length;\n    const start = Math.min(total, Math.max(1, Math.round(this.props.step ?? 1))) - 1;\n    const cur = s.cur ?? start;\n    const done = s.done ?? steps.map((_, i) => i < start);\n    const finished = !!s.finished;\n    const theme = s.theme ?? this.props.theme ?? 'dark';\n    const tab = s.tab ?? this.props.panel ?? 'kit';\n    const kit = s.kit || {};\n    const set = (patch) => this.setState(patch);\n    const pad = (n) => String(n).padStart(2, '0');\n    const doneCount = done.filter(Boolean).length;\n\n    const cues = steps.map((st, i) => {\n      const isRun = i === cur && !finished;\n      const isOk = !isRun && !!done[i];\n      const isIdle = !isRun && !done[i];\n      return {\n        num: pad(i + 1),\n        title: st.title,\n        phase: st.phase,\n        showPhase: i === 0 || steps[i - 1].phase !== st.phase,\n        isRun, isOk, isIdle,\n        word: isRun ? 'RUN' : (isOk ? 'OK' : 'IDLE'),\n        cls: isRun ? '' : 'hov',\n        ariaCurrent: isRun ? 'step' : undefined,\n        border: isRun ? '1px solid var(--accent)' : '1px solid var(--line)',\n        bg: isRun ? 'var(--raised)' : 'var(--card)',\n        ink: isOk ? 'var(--ink-muted)' : 'var(--ink)',\n        pillEdge: isOk ? 'var(--edge-ok)' : (isRun ? 'var(--accent)' : 'var(--line)'),\n        pillInk: isOk ? 'var(--ok)' : (isRun ? 'var(--ink)' : 'var(--idle)'),\n        pick: () => set({ cur: i, finished: false })\n      };\n    });\n\n    const st = steps[cur];\n    const curDone = !!done[cur];\n    const notes = st.notes.map((k) => {\n      const n = D.notes[k];\n      const crit = n.kind === 'crit';\n      const warn = n.kind === 'warn';\n      return {\n        title: n.title || '', text: n.text, fix: n.fix || '',\n        isMistake: crit || warn, isTip: n.kind === 'tip',\n        word: crit ? 'CRIT' : 'WARN',\n        color: crit ? 'var(--crit)' : 'var(--warn)',\n        edge: crit ? 'var(--edge-crit)' : (warn ? 'var(--edge-warn)' : 'var(--line)')\n      };\n    });\n\n    const plates = st.plates.map((p) => {\n      const ph = p.photo ? D.photos[p.photo] : null;\n      return {\n        isPhoto: !!ph,\n        src: ph ? ph.src : '',\n        alt: ph ? ph.alt : '',\n        credit: ph ? 'PHOTO ' + ph.short : 'DRAWING',\n        annot: !!p.annot,\n        cap: p.cap,\n        dBattery: p.draw === 'battery', dPull: p.draw === 'pull', dPush: p.draw === 'push',\n        dMirror: p.draw === 'mirror', dSlit: p.draw === 'slit', dClean: p.draw === 'clean',\n        dOrder: p.draw === 'order', dSeat: p.draw === 'seat', dCoolant: p.draw === 'coolant',\n        dIdle: p.draw === 'idle'\n      };\n    });\n\n    const route = D.route.map((n, j) => {\n      const on = st.nodes.indexOf(n.id) !== -1;\n      return {\n        label: n.label, tag: n.tag, link: j > 0,\n        border: on ? '1px solid var(--accent)' : '1px solid var(--line)',\n        bg: on ? 'var(--raised)' : 'transparent',\n        ink: on ? 'var(--ink)' : 'var(--ink-dim)',\n        sub: on ? 'var(--ink-muted)' : 'var(--ink-dim)'\n      };\n    });\n\n    const openOthers = done.some((x, i) => !x && i !== cur);\n    const goLabel = !openOthers ? 'FINISH JOB' : (curDone ? 'NEXT OPEN STEP' : 'MARK STEP ' + pad(cur + 1) + ' DONE');\n\n    const go = () => {\n      const d = done.slice();\n      d[cur] = true;\n      let next = d.findIndex((x, i) => !x && i > cur);\n      if (next < 0) next = d.findIndex((x) => !x);\n      if (next < 0) set({ done: d, finished: true });\n      else set({ done: d, cur: next, finished: false });\n    };\n    const back = () => {\n      if (finished) { set({ finished: false }); return; }\n      if (cur === 0) return;\n      const d = done.slice();\n      d[cur - 1] = false;\n      set({ cur: cur - 1, done: d });\n    };\n    const reset = () => set({ cur: 0, done: steps.map(() => false), finished: false });\n    const backDisabled = !finished && cur === 0;\n\n    const topIdle = !finished && doneCount === 0 && cur === 0;\n    const topOk = finished;\n    const topRun = !finished && !topIdle;\n    const topWord = topOk ? 'OK' : (topIdle ? 'IDLE' : 'RUN');\n    const topPhase = topOk ? 'OK / JOB COMPLETE' : topWord + ' / ' + st.phase;\n\n    const isDark = theme !== 'light';\n\n    const tabDefs = [{ id: 'kit', label: 'KIT' }, { id: 'why', label: 'WHY' }, { id: 'risks', label: 'RISKS' }, { id: 'photos', label: 'PHOTOS' }];\n    const tabs = tabDefs.map((t) => {\n      const on = t.id === tab;\n      return {\n        label: t.label, pressed: on, cls: on ? '' : 'hov',\n        edge: on ? 'var(--accent)' : 'var(--line)',\n        bg: on ? 'var(--raised)' : 'transparent',\n        ink: on ? 'var(--ink)' : 'var(--ink-muted)',\n        pick: () => set({ tab: t.id })\n      };\n    });\n\n    const toItems = (list) => list.map((it) => {\n      const on = !!kit[it.id];\n      const ph = it.thumb ? D.photos[it.thumb] : null;\n      return {\n        name: it.name, note: it.note || '', hasNote: !!it.note, on,\n        hasThumb: !!ph, thumbSrc: ph ? (ph.thumb || ph.src) : '',\n        iElbow: it.icon === 'elbow', iSleeve: it.icon === 'sleeve', iKnife: it.icon === 'knife',\n        iJug: it.icon === 'jug', iRag: it.icon === 'rag',\n        ink: on ? 'var(--ink-muted)' : 'var(--ink)',\n        toggle: () => set({ kit: Object.assign({}, kit, { [it.id]: !on }) })\n      };\n    });\n    const count = (list) => list.filter((it) => !!kit[it.id]).length + '/' + list.length;\n\n    const risks = ['mRoot', 'mForce', 'mSeat', 'mCool'].map((k) => {\n      const n = D.notes[k];\n      const crit = n.kind === 'crit';\n      return {\n        title: n.title, fix: n.fix,\n        word: crit ? 'CRIT' : 'WARN',\n        color: crit ? 'var(--crit)' : 'var(--warn)',\n        edge: crit ? 'var(--edge-crit)' : 'var(--edge-warn)',\n        stepLabel: 'STEP ' + pad(n.step),\n        aria: n.title + ', go to step ' + n.step,\n        jump: () => set({ cur: n.step - 1, finished: false })\n      };\n    });\n\n    const credits = D.photoOrder.map((k) => {\n      const p = D.photos[k];\n      return { src: p.thumb || p.src, what: p.what, author: p.author, license: p.license, page: p.page };\n    });\n\n    return {\n      themeClass: isDark ? 'ft ft-dark' : 'ft ft-light',\n      isDark, isLight: !isDark,\n      themeLabel: isDark ? 'LIGHT' : 'DARK',\n      themeAria: isDark ? 'Switch to light theme' : 'Switch to dark theme',\n      toggleTheme: () => set({ theme: isDark ? 'light' : 'dark' }),\n      topOk, topIdle, topRun, topPhase,\n      doneText: pad(doneCount) + '/' + total,\n      reset,\n      cues,\n      live: !finished,\n      finished,\n      curNum: pad(cur + 1),\n      curPhase: st.phase,\n      curTitle: st.title,\n      curBody: st.body,\n      curIsOk: curDone, curIsRun: !curDone,\n      curWord: curDone ? 'OK' : 'RUN',\n      curPillEdge: curDone ? 'var(--edge-ok)' : 'var(--accent)',\n      curPillInk: curDone ? 'var(--ok)' : 'var(--ink)',\n      plates,\n      route,\n      notes,\n      go, back, goLabel, backDisabled,\n      backEdge: backDisabled ? 'var(--line)' : 'var(--line-strong)',\n      backInk: backDisabled ? 'var(--ink-dim)' : 'var(--ink)',\n      tabs,\n      tabKit: tab === 'kit', tabWhy: tab === 'why', tabRisks: tab === 'risks', tabPhotos: tab === 'photos',\n      pre: toItems(D.pre), parts: toItems(D.parts), tools: toItems(D.tools),\n      preCount: count(D.pre), partsCount: count(D.parts), toolsCount: count(D.tools),\n      risks,\n      credits\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
